<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CADASTRO | Evandro</title>
</head>
<body>
    <section class="hero">
        <div class="container hero-container">
            <div class="hero-img">
                <img src="img/hero.jpg" alt="LOGIN">
            </div>
            <div class="hero-content">
                <h2>CADASTRE-SE EM <span>"Nome_da_empresa"</span></h2>
                <form action="">
                    <hr>
                    <br>
                    <h3>CADASTRO</h3>
                    <br>
                    <div class="dados">
                        <br>
                        <input type="text" placeholder="Nome do usuário" required>
                        <br>
                        <input type="email" placeholder="exemplo@gmail.com" required>
                        <br>
                        <input type="password" placeholder="Palavra-passe" required>
                        <br>
                        <button class="btn" onclick="cadastrar">Cadastrar</button>
                    </div>
                    
                </form>
            </div>
        </div>
    </section>
</body>
</html>
